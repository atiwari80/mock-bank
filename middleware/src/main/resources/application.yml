server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mock-bank-middleware
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mockbank}
    username: ${DB_USER:mockbank}
    password: ${DB_PASSWORD:mockbank}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Migrations live in /db/migrations. The Docker build copies them onto the
    # classpath; for a local run point this at the filesystem, e.g.
    #   FLYWAY_LOCATIONS=filesystem:../db/migrations
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false

# The fraud-check service is a separate app; Person A wires the client to this.
fraud:
  service:
    base-url: ${FRAUD_SERVICE_URL:http://localhost:8081}

# The credit-check service is a separate app; Feature 6 wires the client to this.
credit:
  service:
    base-url: ${CREDIT_SERVICE_URL:http://localhost:8082}

logging:
  level:
    com.mockbank: INFO
