server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths still serve the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* is the middleware, same origin as the UI so there is no CORS to set up.
    location /api/ {
        # Resolve through Docker's DNS on every request via a variable upstream,
        # so rebuilding just the middleware container does not leave nginx
        # holding a stale IP and serving 502s until it is restarted too.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $middleware_host middleware:8080;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$middleware_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }
}
