# Everything runs on compose's own default project network, so `docker compose
# up` works on a bare machine with no setup beforehand. Services find each other
# by service name: postgres, middleware, fraud-service, credit-check-service,
# frontend.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mockbank-postgres
    environment:
      POSTGRES_DB: mockbank
      POSTGRES_USER: mockbank
      POSTGRES_PASSWORD: mockbank
    # Host ports sit in the 1xxxx range so this stack can share a machine with
    # others. Only host access is shifted — in-container ports are unchanged.
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockbank -d mockbank"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No named volume on purpose: the DB is disposable. `docker compose down`
    # then `up` gives you a clean, freshly-migrated, freshly-seeded database.

  middleware:
    build:
      # Root context so the image can bake /db/migrations onto the classpath.
      context: .
      dockerfile: middleware/Dockerfile
    container_name: mockbank-middleware
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/mockbank
      DB_USER: mockbank
      DB_PASSWORD: mockbank
      # Point these at a stub to swap either scoring service out; the defaults
      # are the real ones in this project.
      FRAUD_SERVICE_URL: ${FRAUD_SERVICE_URL:-http://fraud-service:8081}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL:-http://credit-check-service:8082}
    ports:
      - "18080:8080"
    # /health needs no auth and touches no dependency, so "healthy" here means
    # the API is serving. start_period covers Spring's boot plus the Flyway
    # migrations, which run before the port opens.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  fraud-service:
    build:
      context: ./fraud-service
    container_name: mockbank-fraud-service
    environment:
      SERVER_PORT: 8081
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  credit-check-service:
    build:
      context: ./credit-check-service
    container_name: mockbank-credit-check-service
    environment:
      SERVER_PORT: 8082
    ports:
      - "18082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: mockbank-frontend
    ports:
      - "13000:80"
    # A real request through nginx for the built index.html — proves it is
    # serving the SPA, not merely that the process started.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/index.html"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      - middleware

  # Verification, on the project network, against service names — nothing runs
  # on the host.
  #   docker compose --profile test run --rm smoke
  smoke:
    build:
      context: ./smoke
    container_name: mockbank-smoke
    profiles: ["test"]
    depends_on:
      - middleware
      - fraud-service
      - credit-check-service
      - frontend
