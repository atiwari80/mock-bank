# The shared network lets a separate compose project (the testing-automation
# repo) reach these services by name. It is declared external, so this project
# does not create it — it must exist first:
#
#   docker network create bank-test-network
#
# Every service also stays on this project's own default network, so running
# this repo on its own behaves exactly as it always did.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mockbank-postgres
    environment:
      POSTGRES_DB: mockbank
      POSTGRES_USER: mockbank
      POSTGRES_PASSWORD: mockbank
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockbank -d mockbank"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No named volume on purpose: the DB is disposable. `docker-compose down`
    # then `up` gives you a clean, freshly-migrated, freshly-seeded database.
    networks:
      - default
      - bank-test-network

  middleware:
    build:
      # Root context so the image can bake /db/migrations onto the classpath.
      context: .
      dockerfile: middleware/Dockerfile
    container_name: mockbank-middleware
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/mockbank
      DB_USER: mockbank
      DB_PASSWORD: mockbank
      # Override to http://wiremock:8080 for generated-test runs. The production
      # default remains Repo 1's real fraud service.
      FRAUD_SERVICE_URL: ${FRAUD_SERVICE_URL:-http://fraud-service:8081}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL:-http://credit-check-service:8082}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - bank-test-network

  fraud-service:
    build:
      context: ./fraud-service
    container_name: mockbank-fraud-service
    environment:
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - default
      - bank-test-network

  credit-check-service:
    build:
      context: ./credit-check-service
    container_name: mockbank-credit-check-service
    environment:
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    networks:
      - default
      - bank-test-network

  frontend:
    build:
      context: ./frontend
    container_name: mockbank-frontend
    ports:
      - "3000:80"
    depends_on:
      - middleware
    networks:
      default: {}
      # Playwright in the pipeline repo reaches the UI as bank-ui.
      bank-test-network:
        aliases:
          - bank-ui

  # Verification, in the network, against service names — nothing runs on the host.
  #   docker compose --profile test run --rm smoke
  smoke:
    build:
      context: ./smoke
    container_name: mockbank-smoke
    profiles: ["test"]
    depends_on:
      - middleware
      - fraud-service
      - credit-check-service
      - frontend
    networks:
      - default
      - bank-test-network

networks:
  bank-test-network:
    external: true
    name: bank-test-network
